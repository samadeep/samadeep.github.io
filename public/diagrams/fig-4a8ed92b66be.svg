" x="954" y="56" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="954" y="56">Earth</tspan></text><rect class="fn fn-main" x="26" y="120" width="201.2" height="41" rx="8"/><text class="ft" x="126.6" y="140.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="126.6" y="140.5">Cosmic accelerator</tspan></text><rect class="fn fn-deny" x="439.7" y="120" width="201.2" height="41" rx="8"/><text class="ft" x="540.3" y="140.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="540.3" y="140.5">gamma ray</tspan></text><rect class="fn fn-peer" x="853.4" y="120" width="201.2" height="41" rx="8"/><text class="ft" x="954" y="140.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="954" y="140.5">Earth</tspan></text><rect class="fn fn-main" x="26" y="204.5" width="201.2" height="41" rx="8"/><text class="ft" x="126.6" y="225" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="126.6" y="225">Cosmic accelerator</tspan></text><rect class="fn fn-allow" x="439.7" y="195" width="201.2" height="60" rx="8"/><text class="ft" x="540.3" y="215.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="540.3" y="215.5">neutrino</tspan><tspan x="540.3" y="234.5">(no charge)</tspan></text><rect class="fn fn-peer" x="853.4" y="204.5" width="201.2" height="41" rx="8"/><text class="ft" x="954" y="225" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="954" y="225">Earth</tspan></text></svg>