="M225 718L220.7 710L229.3 710Z"/><rect class="fp" x="145.5" y="686" width="159" height="16"/><text class="fl tone-lost" x="225" y="694" text-anchor="middle" dominant-baseline="central" font-size="11"><tspan x="225" y="694">still riding on an RNN</tspan></text><rect class="fn fn-box" x="26" y="70" width="398" height="60" rx="8"/><text class="ft" x="225" y="90.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="225" y="90.5">n-gram counting</tspan><tspan x="225" y="109.5">1948, Kneser-Ney 1995</tspan></text><rect class="fn fn-worker" x="26" y="178" width="398" height="60" rx="8"/><text class="ft" x="225" y="198.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="225" y="198.5">neural language model</tspan><tspan x="225" y="217.5">Bengio 2003</tspan></text><rect class="fn fn-worker" x="26" y="286" width="398" height="60" rx="8"/><text class="ft" x="225" y="306.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="225" y="306.5">recurrent network</tspan><tspan x="225" y="325.5">Elman 1990, Mikolov 2010</tspan></text><rect class="fn fn-worker" x="26" y="394" width="398" height="60" rx="8"/><text class="ft" x="225" y="414.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="225" y="414.5">LSTM and GRU</tspan><tspan x="225" y="433.5">1997, 2000, 2014</tspan></text><rect class="fn fn-worker" x="26" y="502" width="398" height="60" rx="8"/><text class="ft" x="225" y="522.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="225" y="522.5">sequence to sequence</tspan><tspan x="225" y="541.5">2014</tspan></text><rect class="fn fn-main" x="26" y="610" width="398" height="60" rx="8"/><text class="ft" x="225" y="630.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="225" y="630.5">attention</tspan><tspan x="225" y="649.5">Bahdanau 2014, Luong 2015</tspan></text><rect class="fn fn-allow" x="26" y="718" width="398" height="60" rx="8"/><text class="ft" x="225" y="738.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="225" y="738.5">the transformer, 2017</tspan><tspan x="225" y="757.5">(next chapter)</tspan></text></svg>