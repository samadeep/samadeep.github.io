1"><tspan x="1616" y="100">stays in numerator</tspan></text><path class="fe" d="M1160.9 194H1686.8"/><path class="fa " d="M1694.8 194L1686.7 198.3L1686.7 189.7Z"/><rect class="fp" x="1410.1" y="186" width="35.5" height="16"/><text class="fl " x="1427.9" y="194" text-anchor="middle" dominant-baseline="central" font-size="11"><tspan x="1427.9" y="194">kept</tspan></text><rect class="fn fn-worker" x="26" y="70" width="175" height="60" rx="8"/><text class="ft" x="113.5" y="90.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="113.5" y="90.5">e^-m</tspan><tspan x="113.5" y="109.5">= 3.05e-8</tspan></text><rect class="fn fn-deny" x="358.6" y="70" width="175" height="60" rx="8"/><text class="ft" x="446.1" y="90.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="446.1" y="90.5">1 + e^-m</tspan><tspan x="446.1" y="109.5">= 1.0 exactly</tspan></text><rect class="fn fn-deny" x="691.2" y="70" width="175" height="60" rx="8"/><text class="ft" x="778.7" y="90.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="778.7" y="90.5">g_t = 1/1.0 - 1</tspan><tspan x="778.7" y="109.5">= 0</tspan></text><rect class="fn fn-worker" x="26" y="164" width="175" height="60" rx="8"/><text class="ft" x="113.5" y="184.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="113.5" y="184.5">q_j, each</tspan><tspan x="113.5" y="203.5">= 1.5e-8</tspan></text><rect class="fn fn-deny" x="691.2" y="164" width="175" height="60" rx="8"/><text class="ft" x="778.7" y="184.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="778.7" y="184.5">sum of g</tspan><tspan x="778.7" y="203.5">= +3.05e-8</tspan></text><rect class="fn fn-worker" x="942.2" y="70" width="218.7" height="60" rx="8"/><text class="ft" x="1051.6" y="90.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1051.6" y="90.5">e^-m</tspan><tspan x="1051.6" y="109.5">= 3.05e-8</tspan></text><rect class="fn fn-main" x="1318.5" y="70" width="218.7" height="60" rx="8"/><text class="ft" x="1427.9" y="90.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1427.9" y="90.5">softplus(-m)</tspan><tspan x="1427.9" y="109.5">no 1 + tiny</tspan></text><rect class="fn fn-allow" x="1694.8" y="70" width="218.7" height="60" rx="8"/><text class="ft" x="1804.1" y="90.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1804.1" y="90.5">g_t = -e^-m/(1+e^-m)</tspan><tspan x="1804.1" y="109.5">= -3.05e-8</tspan></text><rect class="fn fn-worker" x="942.2" y="164" width="218.7" height="60" rx="8"/><text class="ft" x="1051.6" y="184.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1051.6" y="184.5">q_j</tspan><tspan x="1051.6" y="203.5">= 1.5e-8</tspan></text><rect class="fn fn-allow" x="1694.8" y="164" width="218.7" height="60" rx="8"/><text class="ft" x="1804.1" y="184.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1804.1" y="184.5">sum of g</tspan><tspan x="1804.1" y="203.5">= 0</tspan></text></svg>