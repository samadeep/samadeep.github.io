  --f-allow: #1f4a2a; --f-deny: #6b2121; --f-ask: #4d4111;
  --f-muted: #6f757c; --f-lost: #ff6b6b; --f-good: #51cf66;
}
.fig-svg .fpanel { fill: var(--f-panel); stroke: var(--f-panel-edge); stroke-width: 2; }
.fig-svg .ftitle { fill: var(--f-ink); font-weight: 500; }
.fig-svg .ftitle-in { fill: var(--f-body); font-weight: 700; letter-spacing: .02em; }
.fig-svg .fn { stroke: var(--f-ink); stroke-width: 1.6; }
.fig-svg .fn-main { fill: var(--f-main); } .fig-svg .fn-worker { fill: var(--f-worker); } .fig-svg .fn-peer { fill: var(--f-peer); }
.fig-svg .fn-shared { fill: var(--f-shared); stroke-dasharray: 2 3; stroke-linecap: round; }
.fig-svg .fn-box { fill: var(--f-box); } .fig-svg .fn-allow { fill: var(--f-allow); } .fig-svg .fn-deny { fill: var(--f-deny); } .fig-svg .fn-ask { fill: var(--f-ask); }
.fig-svg .fn-result { fill: none; stroke-width: 2; stroke-dasharray: 1.5 4; stroke-linecap: round; }
.fig-svg .ft { fill: var(--f-ink); font-weight: 500; }
.fig-svg .ft-card { font-weight: 700; }
.fig-svg .fb { fill: var(--f-body); font-weight: 400; }
.fig-svg .fi { color: var(--f-body); }
.fig-svg .fe { fill: none; stroke: var(--f-ink); stroke-width: 1.8; }
.fig-svg .fa { fill: var(--f-ink); stroke: none; }
.fig-svg .fl { fill: var(--f-ink); font-weight: 400; }
.fig-svg .fp { fill: var(--f-panel); }
.fig-svg .fe-muted { stroke: var(--f-muted); stroke-width: 1.6; } .fig-svg .tone-muted { fill: var(--f-muted); }
.fig-svg .fe-lost { stroke: var(--f-lost); stroke-dasharray: 6 4; } .fig-svg .tone-lost { fill: var(--f-lost); }
.fig-svg .fe-good { stroke: var(--f-good); } .fig-svg .tone-good { fill: var(--f-good); }
.fig-svg .fe-dashed { stroke-dasharray: 5 4; }
.fig-svg .flife { stroke: var(--f-life); stroke-width: 1.5; fill: none; }
.fig-svg .fnote { fill: var(--f-panel); stroke-width: 1.2; }
.fig-svg .fnote { stroke: var(--f-ink); } .fig-svg .fnote.tone-lost { stroke: var(--f-lost); fill: var(--f-panel); }
