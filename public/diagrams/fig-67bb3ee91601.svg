<svg style="font-family:'Aptos Mono','JetBrains Mono',ui-monospace,monospace" class="fig-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 804 265" width="804" height="265" role="img" aria-label="Two panels. Left panel, best only: block [-1, 3] with best 3 and block [2, -1] with best 2 glue into a box saying max(3, 2) = 3, marked wrong. Right panel, four numbers: block [-1, 3] stores sum 2, prefix 2, suffix 3, best 3; block [2, -1] stores sum 1, prefix 2, suffix 1, best 2; glued best is max(3, 2, suffix 3 + prefix 2) = 5, marked right."><style>/* ```fig diagrams (src/lib/remark-fig.mjs). Palette from the Claude Code docs Subagents / Agent Teams figure. */
.fig-svg {
  --f-panel: #e9ecef; --f-panel-edge: #ffffff; --f-ink: #1e1e1e; --f-body: #495057; --f-life: #ced4da;
  --f-main: #ffc9c9; --f-worker: #ffd8a8; --f-peer: #d0bfff; --f-shared: #a5d8ff; --f-box: #ffffff;
  --f-allow: #b2f2bb; --f-deny: #ffa8a8; --f-ask: #ffec99;
  --f-muted: #868e96; --f-lost: #e03131; --f-good: #2f9e44;
  font-family: 'Aptos Mono', 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace;
}
[data-theme='dark'] .fig-svg {
