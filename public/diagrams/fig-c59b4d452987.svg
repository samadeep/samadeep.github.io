al" font-size="14"><tspan x="139.7" y="179.5">request takes a token</tspan></text><rect class="fn fn-shared" x="329.5" y="70" width="201.2" height="41" rx="8"/><text class="ft" x="430.1" y="90.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="430.1" y="90.5">level, up to B</tspan></text><rect class="fn fn-allow" x="329.5" y="159" width="201.2" height="41" rx="8"/><text class="ft" x="430.1" y="179.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="430.1" y="179.5">request adds water</tspan></text><rect class="fn fn-shared" x="606.7" y="70" width="236.2" height="41" rx="8"/><text class="ft" x="724.8" y="90.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="724.8" y="90.5">one timestamp: TAT</tspan></text><rect class="fn fn-allow" x="606.7" y="159" width="236.2" height="41" rx="8"/><text class="ft" x="724.8" y="179.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="724.8" y="179.5">request moves TAT +1/r</tspan></text></svg>