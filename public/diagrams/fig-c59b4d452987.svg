<svg style="font-family:'Aptos Mono','JetBrains Mono',ui-monospace,monospace" class="fig-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 869 226" width="869" height="226" role="img" aria-label="Three panels side by side. Token bucket: tokens up to B, refilled at r per second, and a request takes a token. Leaky bucket: a level up to B, draining at r per second, and a request adds water. GCRA: one timestamp, TAT, and a request is allowed if TAT is at most now plus slack, then moves TAT forward by 1/r."><style>/* ```fig diagrams (src/lib/remark-fig.mjs). Palette from the Claude Code docs Subagents / Agent Teams figure. */
.fig-svg {
  --f-panel: #e9ecef; --f-panel-edge: #ffffff; --f-ink: #1e1e1e; --f-body: #495057; --f-life: #ced4da;
  --f-main: #ffc9c9; --f-worker: #ffd8a8; --f-peer: #d0bfff; --f-shared: #a5d8ff; --f-box: #ffffff;
  --f-allow: #b2f2bb; --f-deny: #ffa8a8; --f-ask: #ffec99;
  --f-muted: #868e96; --f-lost: #e03131; --f-good: #2f9e44;
  font-family: 'Aptos Mono', 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace;
}
[data-theme='dark'] .fig-svg {
  --f-panel: #202225; --f-panel-edge: #2b2e33; --f-ink: #d3d3d3; --f-body: #adb5bd; --f-life: #45494f;
