main" x="26" y="239" width="829" height="41" rx="8"/><text class="ft" x="440.5" y="259.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="440.5" y="259.5">one thread runs each command to the end</tspan></text><rect class="fn fn-worker" x="26" y="328" width="253.7" height="60" rx="8"/><text class="ft" x="152.8" y="348.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="152.8" y="348.5">I/O threads</tspan><tspan x="152.8" y="367.5">read, write sockets</tspan></text><rect class="fn fn-worker" x="313.7" y="328" width="253.7" height="60" rx="8"/><text class="ft" x="440.5" y="348.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="440.5" y="348.5">background threads</tspan><tspan x="440.5" y="367.5">free memory, fsync</tspan></text><rect class="fn fn-worker" x="601.3" y="328" width="253.7" height="60" rx="8"/><text class="ft" x="728.2" y="348.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="728.2" y="348.5">serverCron, 10x a second</tspan><tspan x="728.2" y="367.5">expiry, rehashing</tspan></text></svg>