 dominant-baseline="central" font-size="14"><tspan x="348.8" y="306.5">switch</tspan><tspan x="348.8" y="325.5">packet or optical</tspan></text><rect class="fn fn-peer" x="479" y="295.5" width="192.5" height="41" rx="8"/><text class="ft" x="575.3" y="316" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="575.3" y="316">any other server</tspan></text></svg>