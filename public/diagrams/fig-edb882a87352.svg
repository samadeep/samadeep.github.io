<svg style="font-family:'Aptos Mono','JetBrains Mono',ui-monospace,monospace" class="fig-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 566 461" width="566" height="461" role="img" aria-label="Two panels. Left, process_vm_readv: profiler to kernel labelled system call, every read; kernel to task object labelled 510 ns per read; a bad address returns EFAULT and the snapshot is dropped. Right, guarded memcpy: profiler to task object labelled memcpy, 10 ns; a bad address raises SIGSEGV, the handler siglongjmps back, the copy returns -1 and the snapshot is dropped, about 1,040 ns, only when it happens."><style>/* ```fig diagrams (src/lib/remark-fig.mjs). Palette from the Claude Code docs Subagents / Agent Teams figure. */
.fig-svg {
