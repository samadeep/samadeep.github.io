75" height="60" rx="8"/><text class="ft" x="113.5" y="259.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="113.5" y="259.5">flip it back</tspan><tspan x="113.5" y="278.5">data correct</tspan></text><rect class="fn fn-deny" x="277" y="70" width="175" height="41" rx="8"/><text class="ft" x="364.6" y="90.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="364.6" y="90.5">bits 5, 40 flip</tspan></text><rect class="fn fn-worker" x="277" y="145" width="175" height="60" rx="8"/><text class="ft" x="364.6" y="165.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="364.6" y="165.5">parity even,</tspan><tspan x="364.6" y="184.5">syndrome not 0</tspan></text><rect class="fn fn-ask" x="277" y="239" width="175" height="60" rx="8"/><text class="ft" x="364.6" y="259.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="364.6" y="259.5">machine-check</tspan><tspan x="364.6" y="278.5">nothing silent</tspan></text><rect class="fn fn-deny" x="528.1" y="70" width="210" height="41" rx="8"/><text class="ft" x="633.1" y="90.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="633.1" y="90.5">bits 5, 40, 61 flip</tspan></text><rect class="fn fn-worker" x="528.1" y="145" width="210" height="60" rx="8"/><text class="ft" x="633.1" y="165.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="633.1" y="165.5">parity odd:</tspan><tspan x="633.1" y="184.5">looks like 1 flip</tspan></text><rect class="fn fn-deny" x="528.1" y="253" width="210" height="60" rx="8"/><text class="ft" x="633.1" y="273.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="633.1" y="273.5">-X- flips bit 16</tspan><tspan x="633.1" y="292.5">4 bits wrong</tspan></text></svg>