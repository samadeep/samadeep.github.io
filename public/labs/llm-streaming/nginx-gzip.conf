# Default proxy settings on purpose: proxy_buffering is on unless the upstream says otherwise.
worker_processes 1;
pid /tmp/llm-lab-nginx-gz.pid;
error_log /tmp/llm-lab-nginx.err;
events { worker_connections 4096; }
http {
  access_log off;
  server {
    listen 8082;
    gzip on; gzip_types text/event-stream;
    location / { proxy_pass http://127.0.0.1:8080; proxy_http_version 1.1; }
  }
}
